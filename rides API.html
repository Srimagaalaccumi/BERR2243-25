<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🚗 Rides Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1f4037, #99f2c8);
      color: #fff;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
      color: #ffffff;
      text-shadow: 2px 2px #333;
    }

    .table-container {
      max-width: 1100px;
      margin: auto;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      border-radius: 16px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: rgba(255, 255, 255, 0.1);
    }

    th, td {
      padding: 16px;
      text-align: center;
    }

    th {
      font-size: 1rem;
      color: #ffeb3b;
      letter-spacing: 1px;
    }

    td {
      font-size: 0.95rem;
      color: #090909;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.1);
      transition: 0.3s ease;
    }

    input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
    }

    input:disabled {
      color: #0b0b0b;
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .action-buttons button {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .edit-btn {
      background-color: #2196f3;
      color: #121111;
    }

    .edit-btn:hover {
      background-color: #1976d2;
    }

    .save-btn {
      background-color: #7f897f;
      color: #000000;
    }

    .save-btn:hover {
      background-color: #388e3c;
    }

    .delete-btn {
      background-color: #f44336;
      color: #fff;
    }

    .delete-btn:hover {
      background-color: #c62828;
    }

    #error {
      text-align: center;
      color: #ff5252;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>🌟 Fancy Rides Dashboard</h1>
  <div class="table-container">
    <div id="error"></div>
    <table id="ridesTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Pickup</th>
          <th>Destination</th>
          <th>Driver ID</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Table data will be injected here -->
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = "http://localhost:3000/rides";

    function fetchRides() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => renderTable(data))
        .catch(err => {
          document.getElementById("error").textContent = "❌ Error fetching rides: " + err;
        });
    }

    function renderTable(rides) {
      const tbody = document.querySelector("#ridesTable tbody");
      tbody.innerHTML = "";

      rides.forEach(ride => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${ride._id}</td>
          <td><input type="text" value="${ride.pickupLocation}" disabled></td>
          <td><input type="text" value="${ride.destination}" disabled></td>
          <td><input type="text" value="${ride.driverID}" disabled></td>
          <td><input type="text" value="${ride.status}" disabled></td>
          <td class="action-buttons">
            <button class="edit-btn" onclick="toggleEdit(this, '${ride._id}')">Edit</button>
            <button class="delete-btn" onclick="deleteRide('${ride._id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function toggleEdit(button, id) {
      const row = button.closest("tr");
      const inputs = row.querySelectorAll("input");

      if (button.textContent === "Edit") {
        inputs.forEach(input => input.disabled = false);
        button.textContent = "Save";
        button.classList.remove("edit-btn");
        button.classList.add("save-btn");
      } else {
        const updatedRide = {
          pickupLocation: inputs[0].value,
          destination: inputs[1].value,
          driverID: inputs[2].value,
          status: inputs[3].value
        };

        fetch(`${API_URL}/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updatedRide)
        })
        .then(res => res.json())
        .then(() => fetchRides())
        .catch(err => alert("❌ Error updating ride: " + err));
      }
    }

    function deleteRide(id) {
      fetch(`${API_URL}/${id}`, { method: "DELETE" })
        .then(res => res.json())
        .then(() => fetchRides())
        .catch(err => alert("❌ Error deleting ride: " + err));
    }

    fetchRides();
  </script>
</body>
</html>
